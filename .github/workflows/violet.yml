name: violet-main

on:
  workflow_dispatch:

env:
  CHATID: ${{ secrets.CHATID }}
  API_BOT: ${{ secrets.API_BOT }}

jobs:
  hyperbuild:
    runs-on: ubuntu-latest

    steps:
      # 📥 Checkout source
      - name: Creating env!
        uses: actions/checkout@v4

      # 🧰 Install dependencies
      - name: Setting up env!
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            git make bc bison ccache \
            openssl curl zip kmod cpio flex libelf-dev \
            libssl-dev libtfm-dev wget device-tree-compiler \
            ca-certificates python3 binutils \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      # ⚙️ Give permission & build
      - name: Building Kernel...
        run: |
          chmod +x build.sh
          bash build.sh

      # 📦 Upload build output (optional but useful)
      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            *.zip
            *.img
            out/**/*.zip
            out/**/*.img
            
