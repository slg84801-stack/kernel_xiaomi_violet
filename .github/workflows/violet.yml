name: Build Violet KernelSU (Forked)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Space
        run: |
          sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php /usr/local/lib/android
          
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev clang lld llvm zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      - name: Integrate KernelSU
        run: |
          # KernelSU Setup script chalana
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # Defconfig mein KSU enable karna (Violet ke liye standard)
          # Agar aapki repo mein defconfig ka naam alag hai, toh yaha change karein
          CONF=arch/arm64/configs/vendor/violet-perf_defconfig
          if [ ! -f $CONF ]; then
            CONF=$(find arch/arm64/configs/ -name "*violet*defconfig" | head -n 1)
          fi
          echo "CONFIG_KSU=y" >> $CONF
          echo "CONFIG_OVERLAY_FS=y" >> $CONF
          echo "Using Config: $CONF"

      - name: Build Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          
          # Defconfig file name nikalna
          CONF_NAME=$(find arch/arm64/configs/ -name "*violet*defconfig" -exec basename {} \;)
          
          make O=out ARCH=arm64 $CONF_NAME
          
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel
          # Image file find karke copy karna
          IMG=$(find out/arch/arm64/boot/ -name "Image.gz*" | head -n 1)
          cp $IMG AnyKernel/
          cd AnyKernel
          # Device check off karna taaki flashing mein error na aaye
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          zip -r9 ../Violet-KSU-Flashable.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Violet-KernelSU-Zip
          path: Violet-KSU-Flashable.zip
          
