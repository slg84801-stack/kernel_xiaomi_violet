name: Violet A13 KernelSU NEXT SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2️⃣ Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex zip curl \
            libelf-dev libssl-dev cpio \
            device-tree-compiler python3 \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

      # 3️⃣ Clone Proton Clang
      - name: Clone Proton Clang
        run: git clone --depth=1 https://github.com/kdrag0n/proton-clang clang

      # 4️⃣ Integrate KernelSU NEXT (correct new method)
      - name: Integrate KernelSU NEXT
        run: |
          git clone https://github.com/tiann/KernelSU.git
          cd KernelSU
          bash kernel/setup.sh
          cd ..

      # 5️⃣ Integrate SUSFS
      - name: Integrate SUSFS
        run: |
          git clone https://github.com/sidex15/susfs4ksu susfs
          cp -r susfs/* .
          rm -rf susfs

      # 6️⃣ Patch defconfig
      - name: Patch defconfig
        run: |
          DEFCONFIG=arch/arm64/configs/violet-perf_defconfig

          grep -q "CONFIG_KSU=y" $DEFCONFIG || echo "CONFIG_KSU=y" >> $DEFCONFIG
          grep -q "CONFIG_KPROBES=y" $DEFCONFIG || echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          grep -q "CONFIG_KALLSYMS=y" $DEFCONFIG || echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          grep -q "CONFIG_KALLSYMS_ALL=y" $DEFCONFIG || echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          grep -q "CONFIG_SUSFS=y" $DEFCONFIG || echo "CONFIG_SUSFS=y" >> $DEFCONFIG

      # 7️⃣ Build kernel
      - name: Build Kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          mkdir -p out
          make O=out ARCH=arm64 vendor/violet-perf_defconfig

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      # 8️⃣ Pack AnyKernel3 zip
      - name: Pack Flashable Zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          cd AnyKernel3
          zip -r9 violet-A13-KSU-NEXT-SUSFS.zip *

      # 9️⃣ Upload artifact
      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: violet-A13-KSU-NEXT-SUSFS
          path: AnyKernel3/*.zip
          
